apply plugin: 'com.android.application'

android {
    namespace 'com.meow.ledger'
    compileSdk 36
    defaultConfig {
        applicationId 'com.meow.ledger'
        minSdk 26
        targetSdk 36
        versionCode 7
        versionName '1.8.7'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
